/* =========================================
   공통 함수
========================================= */

function esc(value = '') {
    return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[char]));
}

function validateJSONBin() {
    const config = window.JSONBIN_CONFIG || {};

    if (
        !config.binId ||
        config.binId.includes('YOUR_') ||
        config.binId.includes('블라인딩') ||
        !config.accessKey ||
        config.accessKey.includes('YOUR_') ||
        config.accessKey.includes('블라인딩')
    ) {
        throw new Error(
            'index.html 상단에 실제 JSONBin Bin ID와 Access Key를 입력하세요.'
        );
    }
}

async function jsonBinRequest(method, data) {
    validateJSONBin();

    const response = await fetch(
        method === 'GET'
            ? `${JSONBIN_URL()}/latest`
            : JSONBIN_URL(),
        {
            method,

            headers: {
                'Content-Type': 'application/json',
                'X-Access-Key': window.JSONBIN_CONFIG.accessKey
            },

            ...(data ? {
                body: JSON.stringify(data)
            } : {})
        }
    );

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(
            result.message || `JSONBin 요청 실패 (${response.status})`
        );
    }

    return result.record || result;
}

function applyDatabase(record) {
    users = Array.isArray(record.users) ? record.users : [];
    posts = Array.isArray(record.posts) ? record.posts : [];
    promotions = Array.isArray(record.promotions) ? record.promotions : [];

    userProgress =
        record.userProgress &&
        typeof record.userProgress === 'object'
            ? record.userProgress
            : {};

    popupDismissed =
        record.popupDismissed &&
        typeof record.popupDismissed === 'object'
            ? record.popupDismissed
            : {};
}

function databaseSnapshot() {
    return {
        users,
        posts,
        promotions,
        userProgress,
        popupDismissed
    };
}


/* =========================================
   데이터 초기화 및 동기화
========================================= */

async function initSystem() {
    let databaseConnected = false;

    try {
        validateJSONBin();

        const record = await jsonBinRequest('GET');

        applyDatabase(record);

        databaseConnected = true;
        connectionWarning = '';

    } catch (error) {
        console.error('초기 JSONBin 연결 실패:', error);

        /*
           JSONBin 연결이 실패해도 앱 전체를 중단하지 않음.
           관리자 로그인 화면은 정상적으로 표시함.
        */

        users = [];
        posts = [];
        promotions = [];
        userProgress = {};
        popupDismissed = {};

        connectionWarning =
            '온라인 데이터 연결에 실패했습니다. 로그인 화면은 이용할 수 있지만 게시글과 계정 데이터의 온라인 저장은 연결 복구 후 가능합니다.';
    }

    const savedUser = localStorage.getItem(
        'mutation_world_current_user'
    );

    if (savedUser) {
        try {
            const saved = JSON.parse(savedUser);

            if (saved.username === ADMIN_ID) {
                /*
                   관리자는 JSONBin에 계정이 저장되어 있지 않아도
                   브라우저에 로그인 정보가 남아 있으면 복원함.
                */

                let adminAccount = users.find(
                    u => u.username === ADMIN_ID
                );

                if (!adminAccount) {
                    adminAccount = {
                        username: ADMIN_ID,
                        password: ADMIN_PASSWORD,
                        isAdmin: true,
                        createdAt: getDetailedTimeString()
                    };

                    users.push(adminAccount);
                }

                adminAccount.isAdmin = true;
                currentUser = adminAccount;

            } else {
                currentUser = users.find(
                    u => u.username === saved.username
                ) || null;
            }

        } catch (_) {
            currentUser = null;
        }
    }

    if (currentUser) {
        currentView = 'dashboard';
    } else {
        currentView = 'login';
    }

    adminPersona = 'normal';

    lastLoadedJSON = JSON.stringify(databaseSnapshot());

    if (syncTimer) {
        clearInterval(syncTimer);
    }

    /*
       최초 연결에 실패했더라도 주기적으로 재연결을 시도함.
    */

    syncTimer = setInterval(refreshSharedData, 8000);

    render();
}

async function refreshSharedData() {
    try {
        const record = await jsonBinRequest('GET');

        const incoming = {
            users: Array.isArray(record.users) ? record.users : [],
            posts: Array.isArray(record.posts) ? record.posts : [],
            promotions: Array.isArray(record.promotions) ? record.promotions : [],
            userProgress: record.userProgress || {},
            popupDismissed: record.popupDismissed || {}
        };

        const incomingJSON = JSON.stringify(incoming);

        if (incomingJSON !== lastLoadedJSON) {
            const activeUsername =
                currentUser ? currentUser.username : null;

            applyDatabase(incoming);

            if (activeUsername === ADMIN_ID) {
                let adminAccount = users.find(
                    u => u.username === ADMIN_ID
                );

                if (!adminAccount) {
                    adminAccount = {
                        username: ADMIN_ID,
                        password: ADMIN_PASSWORD,
                        isAdmin: true,
                        createdAt: getDetailedTimeString()
                    };

                    users.push(adminAccount);
                }

                adminAccount.isAdmin = true;
                currentUser = adminAccount;

            } else {
                currentUser = activeUsername
                    ? users.find(u => u.username === activeUsername) || null
                    : null;
            }

            lastLoadedJSON = incomingJSON;
            connectionWarning = '';

            if (
                !currentUser &&
                currentView !== 'login' &&
                currentView !== 'signup'
            ) {
                currentView = 'login';
            }

            render();
        }

    } catch (error) {
        console.warn('JSONBin 동기화 실패:', error);
    }
}

function saveData() {
    /*
       이전 저장이 실패했더라도 다음 저장 요청은 계속 진행함.
    */

    const task = saveQueue
        .catch(() => {})
        .then(async () => {
            const snapshot = databaseSnapshot();

            await jsonBinRequest('PUT', snapshot);

            lastLoadedJSON = JSON.stringify(snapshot);
            connectionWarning = '';

            return true;
        });

    saveQueue = task;

    return task.catch(error => {
        console.error('온라인 데이터 저장 실패:', error);

        connectionWarning =
            '온라인 저장에 실패했습니다. JSONBin 설정과 연결 상태를 확인하세요.';

        throw error;
    });
}

}

        return '관리자';
    }

    return currentUser ? currentUser.username : '익명';

function handleLogin(e) {
    e.preventDefault();

    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('loginPw').value;

    /*
       관리자 로그인:
       JSONBin 저장 성공 여부와 로그인 절차를 분리함.
    */

    if (id === ADMIN_ID) {

        if (pw !== ADMIN_PASSWORD) {
            alert('관리자 아이디 또는 비밀번호가 틀렸습니다.');
            return;
        }

        let adminAccount = users.find(
            u => u.username === ADMIN_ID
        );

        if (!adminAccount) {
            adminAccount = {
                username: ADMIN_ID,
                password: ADMIN_PASSWORD,
                isAdmin: true,
                createdAt: getDetailedTimeString()
            };

            users.push(adminAccount);
        }

        adminAccount.password = ADMIN_PASSWORD;
        adminAccount.isAdmin = true;

        currentUser = adminAccount;
        adminPersona = 'normal';

        localStorage.setItem(
            'mutation_world_current_user',
            JSON.stringify({
                username: ADMIN_ID
            })
        );

        /*
           먼저 대시보드로 이동.
           JSONBin 저장은 별도로 실행함.
        */

        currentView = 'dashboard';
        currentSeason = null;
        showSeasonPopups = false;

        render();

        saveData().catch(error => {
            console.error('관리자 계정 저장 실패:', error);
        });

        return;
    }

    // 일반 회원 로그인
    const found = users.find(
        u =>
            u.username === id &&
            u.password === pw &&
            u.username !== ADMIN_ID
    );

    if (!found) {
        alert('아이디 또는 비밀번호가 일치하지 않습니다.');
        return;
    }

    currentUser = found;
    adminPersona = 'normal';

    localStorage.setItem(
        'mutation_world_current_user',
        JSON.stringify({
            username: found.username
        })
    );

    navigate('dashboard');
}

async function handleSignup(e) {
    e.preventDefault();

    const id = document.getElementById('signupId').value.trim();
    const pw = document.getElementById('signupPw').value;

    if (id.length < 3 || pw.length < 4) {
        alert('아이디는 3자 이상, 비밀번호는 4자 이상 입력하세요.');
        return;
    }

    if (id === ADMIN_ID) {
        alert('해당 아이디는 사용할 수 없습니다.');
        return;
    }

    if (users.some(u => u.username === id)) {
        alert('이미 존재하는 아이디입니다.');
        return;
    }

    users.push({
        username: id,
        password: pw,
        isAdmin: false,
        createdAt: getDetailedTimeString()
    });

    try {
        await saveData();

        alert('회원가입 완료! 로그인해주세요.');

        navigate('login');

    } catch (error) {
        users = users.filter(u => u.username !== id);

        alert('회원가입 저장에 실패했습니다. JSONBin 연결을 확인하세요.');
    }
}

function logout() {
    currentUser = null;
    adminPersona = 'normal';

    localStorage.removeItem('mutation_world_current_user');

    navigate('login');
}

function setAdminPersona(persona) {
    if (!isAdmin()) return;

    if (!['normal', 'alpha', 'beta', 'omega'].includes(persona)) {
        return;
    }

    adminPersona = persona;

    render();
}

function navigate(view, season = null, tab = 'viewer') {
    currentView = view;

    if (season) {
        currentSeason = season;

        const todayStr = new Date().toDateString();
        const dismissKey = `${currentUser.username}_${season}`;

        showSeasonPopups =
            popupDismissed[dismissKey] !== todayStr;

        popupPage = 0;

    } else {
        currentSeason = null;
        showSeasonPopups = false;
    }

    if (tab) currentTab = tab;

    render();
}

function closePopups() {
    showSeasonPopups = false;
    render();
}

function dismissPopupsToday() {
    const todayStr = new Date().toDateString();

    const dismissKey =
        `${currentUser.username}_${currentSeason}`;

    popupDismissed[dismissKey] = todayStr;

    showSeasonPopups = false;

    saveData().catch(error => {
        console.error(error);
    });

    render();
}

/* =========================================
   퀴즈
========================================= */

function startQuiz(seasonKey) {
    currentQuizData = quizzes[seasonKey];
    quizAnswers = {};

    currentView = 'quiz';

    render();
}

function submitQuiz() {
    let allCorrect = true;

    currentQuizData.questions.forEach((item, index) => {
        const userAns = (quizAnswers[index] || '')
            .trim()
            .replace(/\s+/g, '');

        const isMatch = item.answers.some(
            ans => ans.replace(/\s+/g, '') === userAns
        );

        if (!isMatch) allCorrect = false;
    });

    if (allCorrect) {
        if (!userProgress[currentUser.username]) {
            userProgress[currentUser.username] = {};
        }

        userProgress[currentUser.username][
            currentQuizData.nextSeason
        ] = true;

        saveData().catch(error => {
            console.error(error);
        });

        alert('퀴즈 정통과! 해당 기수의 입장이 허용됩니다.');

        navigate(
            'season',
            currentQuizData.nextSeason,
            'viewer'
        );

    } else {
        alert('정답이 틀렸습니다. 다시 확인하고 도전해주세요!');
    }
}


/* =========================================
   메인 렌더링
========================================= */

function render() {
    const app = document.getElementById('app');

    if (!app) return;

    app.innerHTML = '';

    if (currentView === 'login') {
        app.innerHTML = renderLogin();

    } else if (currentView === 'signup') {
        app.innerHTML = renderSignup();

    } else if (currentView === 'dashboard') {
        app.innerHTML = renderDashboard();

    } else if (currentView === 'quiz') {
        app.innerHTML = renderQuiz();

    } else if (currentView === 'season') {
        app.innerHTML = renderSeason();
    }
}

            <main class="flex-1 max-w-4xl w-full mx-auto p-5 space-y-5">

                ${currentTab === 'viewer' ? `

                    <section class="bg-slate-900/70 border border-slate-800 rounded-2xl p-8 text-center">

                        <h3 class="text-2xl font-black mb-3">
                            작품 아카이브 · ${season.name}
                        </h3>

                        <p class="text-slate-300 text-sm">
                            작가 및 고위 관계자가 공개한 공식 작품 내용을 확인하는 공간입니다.

                    ${isAdmin() ? `

                        <section class="bg-slate-900 border border-purple-900 rounded-2xl p-5 space-y-3">

                                    <i class="fa-solid fa-lock mr-2"></i>
                                    관리자 전용 작품 등록

                                </span>

                            <input
                                id="viewerTitle"
                                class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"

                            <textarea
                                id="viewerContent"
                                rows="6"
                                class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"

                            </textarea>

                    </section>

                ${currentTab === 'writer' ? `

/* =========================================
   탭 이동
========================================= */

function setTab(value) {
    currentTab = value;
    render();
}


/* =========================================
   좋아요 및 댓글 공통 기능
========================================= */

function getContentItem(id, type) {
    if (type === 'promotion') {
        return promotions.find(item => item.id === id);
    }

    return posts.find(item => item.id === id);
}

function renderInteractions(item, type) {
    item.likedUsers ??= [];
    item.comments ??= [];

    const liked = item.likedUsers.includes(
        currentUser.username
    );

    return `
        <div class="flex items-center flex-wrap gap-4 border-t border-slate-800 pt-3">

            <button
                onclick="toggleLike('${item.id}','${type}')"
                class="text-sm ${liked ? 'text-rose-400' : 'text-slate-400'}">

                <i class="fa-solid fa-heart mr-1"></i>
                좋아요 ${item.likedUsers.length}

            </button>

            <span class="text-xs text-slate-500">
                댓글 ${item.comments.length}개
            </span>

            ${
                isAdmin()
                    ? `
                        <span class="text-xs text-purple-300">
                            좋아요:
                            ${esc(item.likedUsers.join(', ') || '없음')}
                        </span>
                    `
                    : ''
            }

        </div>

        <div class="space-y-2">

            ${item.comments.map(comment => `
                <div class="bg-slate-950 rounded-lg p-3 text-sm">

                    <div class="flex justify-between gap-2">

                        <b class="text-blue-300">
                            ${esc(comment.author)}
                        </b>

                        <span class="text-xs text-slate-600">
                            ${esc(comment.createdAt)}
                        </span>

                    </div>

                    <p class="text-slate-300 mt-1 whitespace-pre-wrap">
                        ${esc(comment.content)}
                    </p>

                    ${
                        isAdmin()
                            ? `
                                <p class="text-xs text-slate-600 mt-1">
                                    계정: ${esc(comment.authorId)}
                                </p>
                            `
                            : ''
                    }

                </div>
            `).join('')}

        </div>

        <div class="flex gap-2">

            <input
                id="comment_${type}_${item.id}"
                class="flex-1 min-w-0 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"
                placeholder="댓글 입력"
                onkeydown="if(event.key==='Enter'){addComment('${item.id}','${type}')}">

            <button
                onclick="addComment('${item.id}','${type}')"
                class="px-4 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">
                등록
            </button>

        </div>
    `;
}


/* =========================================
   게시글
========================================= */

function renderPost(post) {
    const type = 'post';

    return `
        <article class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">

            <div class="flex justify-between gap-3">

                <div>

                    <h4 class="font-bold text-lg">
                        ${esc(post.title)}
                    </h4>

                    <p class="text-xs text-slate-500">
                        ${esc(post.author)} · ${esc(post.createdAt)}
                    </p>

                    ${
                        isAdmin()
                            ? `
                                <p class="text-xs text-slate-600 mt-1">
                                    계정: ${esc(post.authorId || '')}
                                </p>
                            `
                            : ''
                    }

                </div>

                ${
                    isAdmin() || post.authorId === currentUser.username
                        ? `
                            <button
                                onclick="deletePost('${post.id}')"
                                class="text-xs text-rose-400">
                                삭제
                            </button>
                        `
                        : ''
                }

            </div>

            <p class="text-sm whitespace-pre-wrap text-slate-300">
                ${esc(post.content)}
            </p>

            ${renderInteractions(post, type)}

        </article>
    `;
}

function createPost(type = 'writer') {
    if (type === 'viewer' && !isAdmin()) {
        alert('뷰어 게시글은 관리자만 작성할 수 있습니다.');
        return;
    }

    let title;
    let content;

    if (type === 'viewer') {
        title = document.getElementById('viewerTitle')?.value.trim();
        content = document.getElementById('viewerContent')?.value.trim();
    } else {
        title = document.getElementById('postTitle')?.value.trim();
        content = document.getElementById('postContent')?.value.trim();
    }

    if (!title || !content) {
        alert('제목과 내용을 입력하세요.');
        return;
    }

    posts.push({
        id: crypto.randomUUID(),
        season: currentSeason,
        type,
        title,
        content,
        author: getEffectiveAuthor(),
        authorId: currentUser.username,
        createdAt: getDetailedTimeString(),
        likedUsers: [],
        comments: []
    });

    saveData()
        .then(render)
        .catch(() => {
            alert('게시글 저장에 실패했습니다. JSONBin 연결을 확인하세요.');
        });
}

function deletePost(id) {
    const post = posts.find(p => p.id === id);

    if (!post) return;

    if (
        !isAdmin() &&
        post.authorId !== currentUser.username
    ) {
        return;
    }

    if (!confirm('게시글을 삭제할까요?')) return;

    posts = posts.filter(p => p.id !== id);

    saveData()
        .then(render)
        .catch(() => {
            alert('게시글 삭제 저장에 실패했습니다.');
        });
}


/* =========================================
   좋아요
========================================= */

function toggleLike(id, type = 'post') {
    const item = getContentItem(id, type);

    if (!item) return;

    item.likedUsers ??= [];

    const index = item.likedUsers.indexOf(
        currentUser.username
    );

    if (index >= 0) {
        item.likedUsers.splice(index, 1);
    } else {
        item.likedUsers.push(currentUser.username);
    }

    saveData()
        .then(render)
        .catch(() => {
            alert('좋아요 저장에 실패했습니다.');
        });
}


/* =========================================
   댓글
========================================= */

function addComment(id, type = 'post') {
    const item = getContentItem(id, type);

    const input = document.getElementById(
        `comment_${type}_${id}`
    );

    const content = input?.value.trim();

    if (!item || !content) return;

    item.comments ??= [];

    item.comments.push({
        author: getEffectiveAuthor(),
        authorId: currentUser.username,
        content,
        createdAt: getDetailedTimeString()
    });

    saveData()
        .then(render)
        .catch(() => {
            alert('댓글 저장에 실패했습니다.');
        });
}


/* =========================================
   홍보 게시글
========================================= */

function renderPromotion(promo) {
    return `
        <article class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">

            <div class="flex justify-between gap-3">

                <div>
                    <h4 class="font-bold text-lg">
                        ${esc(promo.title)}
                    </h4>

                    <p class="text-xs text-slate-500">
                        ${esc(promo.author)} · ${esc(promo.createdAt)}
                    </p>
                </div>

                ${
                    isAdmin()
                        ? `
                            <button
                                onclick="deletePromotion('${promo.id}')"
                                class="text-xs text-rose-400">
                                삭제
                            </button>
                        `
                        : ''
                }

            </div>

            <p class="text-sm whitespace-pre-wrap text-slate-300">
                ${esc(promo.content)}
            </p>

            ${
                promo.image
                    ? `
                        <img
                            src="${promo.image}"
                            alt="홍보 이미지"
                            class="max-h-96 max-w-full rounded-xl mx-auto object-contain">
                    `
                    : ''
            }

            ${renderInteractions(promo, 'promotion')}

        </article>
    `;
}

async function createPromotion() {
    if (!isAdmin()) {
        alert('홍보 게시글은 관리자만 작성할 수 있습니다.');
        return;
    }

    const title = document.getElementById('promoTitle')?.value.trim();
    const content = document.getElementById('promoContent')?.value.trim();

    const file = document.getElementById('promoImage')?.files?.[0];

    if (!title || !content) {
        alert('제목과 내용을 입력하세요.');
        return;
    }

    let image = '';

    if (file) {

        if (!file.type.startsWith('image/')) {
            alert('이미지 파일만 첨부할 수 있습니다.');
            return;
        }

        if (file.size > 1500000) {
            alert('이미지는 1.5MB 이하로 선택하세요.');
            return;
        }

        image = await new Promise((resolve, reject) => {

            const reader = new FileReader();

            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;

            reader.readAsDataURL(file);

        });
    }

    promotions.push({
        id: crypto.randomUUID(),
        season: currentSeason,
        title,
        content,
        image,
        author: getEffectiveAuthor(),
        authorId: currentUser.username,
        createdAt: getDetailedTimeString(),
        likedUsers: [],
        comments: []
    });

    saveData()
        .then(render)
        .catch(() => {
            alert('홍보 게시글 저장에 실패했습니다.');
        });
}

function deletePromotion(id) {
    if (!isAdmin()) return;

    const promo = promotions.find(p => p.id === id);

    if (!promo) return;

    if (!confirm('홍보 게시글을 삭제할까요?')) return;

    promotions = promotions.filter(p => p.id !== id);

    saveData()
        .then(render)
        .catch(() => {
            alert('홍보 게시글 삭제 저장에 실패했습니다.');
        });
}
