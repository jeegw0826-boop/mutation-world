<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변이 세상 - 공식 팬 커뮤니티 & 아카이브</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (실시간 멀티 클라우드 DB 연동) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔥 [중요] Firebase 콘솔에서 발급받은 본인의 프로젝트 설정값으로 아래를 교체하세요!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        window.isFirebaseConfigured = false; 
        try {
            if(firebaseConfig.apiKey !== "YOUR_API_KEY") {
                const app = initializeApp(firebaseConfig);
                window.db = getFirestore(app);
                window.isFirebaseConfigured = true;
                window.FirebaseSDK = { collection, addDoc, getDocs, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, getDoc };
                console.log("Firebase 온라인 서버 연동 성공!");
            }
        } catch(e) {
            console.log("Firebase 설정 대기 중. 로컬 동기화 모드로 동작합니다.", e);
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .glitch-effect {
            animation: glitch 0.3s infinite;
            color: #ef4444;
            text-shadow: 2px 0 #3b82f6, -2px 0 #10b981;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col">
        <div class="flex-1 flex items-center justify-center">
            <div class="text-slate-400 animate-pulse">데이터 동기화 및 시스템 로딩 중...</div>
        </div>
    </div>

    <script>
        let users = [
            { username: 'jeegwoo', password: 'wlrmsdn0826!', isAdmin: true }
        ];

        let currentUser = null;
        let adminPersona = 'normal';
        let posts = [];
        let userProgress = {};
        let popupDismissed = {};

        let currentView = 'login';
        let currentSeason = null;
        let currentTab = 'viewer';
        let showSeasonPopups = false;

        let currentQuizData = null;
        let quizAnswers = {};

        // 초기 데이터 로드 (Firebase 또는 LocalStorage 폴백)
        async function initSystem() {
            if (window.isFirebaseConfigured && window.db) {
                const { collection, getDocs, onSnapshot } = window.FirebaseSDK;
                
                // 1. 유저 정보 실시간 동기화
                onSnapshot(collection(window.db, 'users'), (snapshot) => {
                    users = [];
                    snapshot.forEach(docSnap => {
                        users.push(docSnap.data());
                    });
                    // 기본 관리자가 없으면 추가
                    if (!users.some(u => u.username === 'jeegwoo')) {
                        users.push({ username: 'jeegwoo', password: 'wlrmsdn0826!', isAdmin: true });
                    }
                    render();
                });

                // 2. 게시글 실시간 동기화
                onSnapshot(collection(window.db, 'posts'), (snapshot) => {
                    posts = [];
                    snapshot.forEach(docSnap => {
                        posts.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    // 초기 공지글이 없으면 자동 생성
                    if (posts.length === 0) {
                        createInitialPost();
                    }
                    render();
                });

                // 세션 복구 체크
                const savedUser = localStorage.getItem('mutation_world_current_user');
                if (savedUser) {
                    currentUser = JSON.parse(savedUser);
                    currentView = 'dashboard';
                }
            } else {
                // Firebase 미설정 시 기존 localStorage 유지 (테스트용)
                const STORAGE_KEYS = {
                    USERS: 'mutation_world_users',
                    CURRENT_USER: 'mutation_world_current_user',
                    POSTS: 'mutation_world_posts',
                    USER_PROGRESS: 'mutation_world_progress',
                    POPUP_DISMISSED: 'mutation_world_popup_dismissed'
                };
                users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [{ username: 'jeegwoo', password: 'wlrmsdn0826!', isAdmin: true }];
                currentUser = JSON.parse(localStorage.getItem(STORAGE_KEYS.CURRENT_USER)) || null;
                posts = JSON.parse(localStorage.getItem(STORAGE_KEYS.POSTS)) || [{
                    id: '1', season: 's1', type: 'viewer', author: 'jeegwoo', isAdmin: true,
                    title: '[공지] 변이 세상 공식 아카이브에 오신 것을 환영합니다.',
                    content: '이곳은 변이 세상 애니메이션의 1기부터 파이널까지 모든 세계관과 후기를 나누는 공간입니다.',
                    likes: 15, likedUsers: ['jeegwoo'], comments: [], time: '2026년 6월 1일 10:30'
                }];
                currentView = currentUser ? 'dashboard' : 'login';
            }
            render();
        }

        async function createInitialPost() {
            if (!window.isFirebaseConfigured) return;
            const { collection, addDoc } = window.FirebaseSDK;
            await addDoc(collection(window.db, 'posts'), {
                season: 's1',
                type: 'viewer',
                author: 'jeegwoo',
                isAdmin: true,
                title: '[공지] 변이 세상 공식 아카이브에 오신 것을 환영합니다.',
                content: '이곳은 변이 세상 애니메이션의 1기부터 파이널까지 모든 세계관과 후기를 나누는 공간입니다.',
                likes: 15,
                likedUsers: ['jeegwoo'],
                comments: [],
                time: '2026년 6월 1일 10:30'
            });
        }

        async function saveData(type, data) {
            if (window.isFirebaseConfigured && window.db) {
                // Firebase 사용 시 백그라운드 클라우드 처리
                const { doc, setDoc, addDoc, collection } = window.FirebaseSDK;
                if (type === 'user_signup') {
                    await setDoc(doc(window.db, 'users', data.username), data);
                }
            } else {
                localStorage.setItem('mutation_world_current_user', JSON.stringify(currentUser));
            }
        }

        function getDetailedTimeString() {
            const now = new Date();
            return `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        function getEffectiveAuthor() {
            if (currentUser && currentUser.isAdmin) {
                if (adminPersona === 'alpha') return '알파';
                if (adminPersona === 'beta') return '베타';
                if (adminPersona === 'omega') return '오메가';
            }
            return currentUser ? currentUser.username : '익명';
        }

        function navigate(view, season = null, tab = 'viewer') {
            currentView = view;
            if (season) {
                currentSeason = season;
                const todayStr = new Date().toDateString();
                const dismissKey = `${currentUser.username}_${season}`;
                showSeasonPopups = (popupDismissed[dismissKey] !== todayStr);
            } else {
                currentSeason = null;
                showSeasonPopups = false;
            }
            if (tab) currentTab = tab;
            render();
        }

        function closePopups() {
            showSeasonPopups = false;
            render();
        }

        function dismissPopupsToday() {
            const todayStr = new Date().toDateString();
            const dismissKey = `${currentUser.username}_${currentSeason}`;
            popupDismissed[dismissKey] = todayStr;
            showSeasonPopups = false;
            render();
        }

        const quizzes = {
            s2: {
                title: '2기 진입 퀴즈 (시즌 1 복습)',
                questions: [
                    { q: '해당 세계관에서 동물의 변이가 일어난 연도는?', answers: ['1573년', '1573'] },
                    { q: '주인공의 이름은?', answers: ['지그문트 보그트', '지그문트', '보그트'] },
                    { q: '주인공의 엄마를 잡아먹은 이는?', answers: ['곰 거생', '곰'] },
                    { q: '주인공이 살던 제국의 이름은?', answers: ['에테르니아 제국', '에테르니아'] }
                ],
                nextSeason: 's2'
            },
            s3p1: {
                title: '3기 PART 1 진입 퀴즈 (시즌 2 복습)',
                questions: [
                    { q: '여성형 거생의 정체는?', answers: ['실비아 차이스', '실비아'] },
                    { q: '말을 하는 거생의 풀네임은?', answers: ['영장류 거생'] },
                    { q: '초대형 거생의 크기는?', answers: ['50m', '50미터', '50'] },
                    { q: '남반구 총괄자의 이름은?', answers: ['카르민 레키'] }
                ],
                nextSeason: 's3p1'
            },
            s3p2: {
                title: '3기 PART 2 진입 퀴즈 (3기 PART 1 복습)',
                questions: [
                    { q: '카르민 셜몽을 죽인 이의 풀네임은?', answers: ['카르민 스나구'] },
                    { q: '3기 part1 내에서 지그문트 보그트가 납치당한 횟수는?', answers: ['2회', '2'] },
                    { q: '마지막에 나가는 조사의 횟수는?', answers: ['58회', '58회 조사', '58'] }
                ],
                nextSeason: 's3p2'
            }
        };

        function startQuiz(seasonKey) {
            currentQuizData = quizzes[seasonKey];
            quizAnswers = {};
            currentView = 'quiz';
            render();
        }

        function submitQuiz() {
            let allCorrect = true;
            currentQuizData.questions.forEach((item, index) => {
                const userAns = (quizAnswers[index] || '').trim().replace(/\s+/g, '');
                const isMatch = item.answers.some(ans => ans.replace(/\s+/g, '') === userAns);
                if (!isMatch) allCorrect = false;
            });

            if (allCorrect) {
                alert('퀴즈 정통과! 해당 기수의 입장이 허용됩니다.');
                if (!userProgress[currentUser.username]) userProgress[currentUser.username] = {};
                userProgress[currentUser.username][currentQuizData.nextSeason] = true;
                navigate('season', currentQuizData.nextSeason, 'viewer');
            } else {
                alert('정답이 틀렸습니다. 다시 확인하고 도전해주세요!');
            }
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;
            app.innerHTML = '';

            if (currentView === 'login') {
                app.innerHTML = renderLoginScreen();
            } else if (currentView === 'signup') {
                app.innerHTML = renderSignupScreen();
            } else if (currentView === 'dashboard') {
                app.innerHTML = renderDashboard();
            } else if (currentView === 'quiz') {
                app.innerHTML = renderQuizScreen();
            } else if (currentView === 'season') {
                app.innerHTML = renderSeasonScreen();
            }
        }

        function renderLoginScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-purple-950 to-slate-950">
                    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-md p-8 rounded-2xl border border-slate-800 shadow-2xl">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 mb-2">변이 세상</h1>
                            <p class="text-slate-400 text-sm">공식 팬 커뮤니티 & 아카이브 시스템 (온라인 공유 모드)</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-5">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">아이디</label>
                                <input type="text" id="loginId" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition" placeholder="아이디 입력">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">비밀번호</label>
                                <input type="password" id="loginPw" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition" placeholder="비밀번호 입력">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg transition">로그인</button>
                        </form>
                        <div class="mt-6 text-center">
                            <button onclick="navigate('signup')" class="text-sm text-blue-400 hover:underline">계정이 없으신가요? 회원가입</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('loginId').value.trim();
            const pw = document.getElementById('loginPw').value.trim();

            const found = users.find(u => u.username === id && u.password === pw);
            if (found) {
                currentUser = found;
                adminPersona = 'normal';
                localStorage.setItem('mutation_world_current_user', JSON.stringify(currentUser));
                navigate('dashboard');
            } else {
                alert('아이디 또는 비밀번호가 일치하지 않습니다.');
            }
        }

        function renderSignupScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-purple-950 to-slate-950">
                    <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-md p-8 rounded-2xl border border-slate-800 shadow-2xl">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-black text-white mb-2">회원가입</h1>
                            <p class="text-slate-400 text-sm">변이 세상의 시민이 되어주세요</p>
                        </div>
                        <form onsubmit="handleSignup(event)" class="space-y-5">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">아이디</label>
                                <input type="text" id="signupId" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition" placeholder="사용할 아이디">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">비밀번호</label>
                                <input type="password" id="signupPw" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500 transition" placeholder="사용할 비밀번호">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg transition">가입 완료</button>
                        </form>
                        <div class="mt-6 text-center">
                            <button onclick="navigate('login')" class="text-sm text-slate-400 hover:underline">로그인 화면으로 돌아가기</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleSignup(e) {
            e.preventDefault();
            const id = document.getElementById('signupId').value.trim();
            const pw = document.getElementById('signupPw').value.trim();

            if (users.some(u => u.username === id)) {
                alert('이미 존재하는 아이디입니다.');
                return;
            }

            const newUser = { username: id, password: pw, isAdmin: false };
            users.push(newUser);
            await saveData('user_signup', newUser);
            alert('회원가입 완료! 로그인해주세요.');
            navigate('login');
        }

        function renderDashboard() {
            if (!currentUser) return '';
            const isAdmin = currentUser.isAdmin;
            const progress = userProgress[currentUser.username] || {};
            const isS2Unlocked = isAdmin || progress.s2;
            const isS3P1Unlocked = isAdmin || progress.s3p1;
            const isS3P2Unlocked = isAdmin || progress.s3p2;

            return `
                <div class="flex-1 flex flex-col">
                    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <h1 class="text-xl font-black bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">변이 세상</h1>
                            <span class="text-xs px-2.5 py-1 bg-slate-800 rounded-full text-slate-300">반가워요, <strong class="text-white">${currentUser.username}</strong>님 ${isAdmin ? '(관리자)' : ''}</span>
                        </div>
                        <button onclick="logout()" class="text-xs text-rose-400 hover:text-rose-300 font-semibold px-3 py-1.5 bg-rose-950/30 border border-rose-900/50 rounded-lg transition">로그아웃</button>
                    </header>

                    <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-8">
                        ${isAdmin ? `
                            <div class="bg-slate-900/90 border border-purple-900/50 rounded-2xl p-6 shadow-xl space-y-4">
                                <div class="flex items-center justify-between">
                                    <h2 class="text-lg font-bold text-purple-300 flex items-center gap-2"><i class="fa-solid fa-mask"></i> 관리자 AI 페르소나 변장 모드</h2>
                                    <span class="text-xs text-slate-400">선택한 캐릭터로 댓글/게시글 작성</span>
                                </div>
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    <button onclick="setAdminPersona('normal')" class="p-3 rounded-xl border text-xs font-bold transition ${adminPersona === 'normal' ? 'bg-purple-600 border-purple-400 text-white' : 'bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-900'}">기본 (관리자 계정명)</button>
                                    <button onclick="setAdminPersona('alpha')" class="p-3 rounded-xl border text-xs font-bold transition ${adminPersona === 'alpha' ? 'bg-cyan-600 border-cyan-400 text-white' : 'bg-slate-950 border-slate-800 text-cyan-400 hover:bg-slate-900'}">[AI] 알파로 변장</button>
                                    <button onclick="setAdminPersona('beta')" class="p-3 rounded-xl border text-xs font-bold transition ${adminPersona === 'beta' ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-slate-950 border-slate-800 text-emerald-400 hover:bg-slate-900'}">[AI] 베타로 변장</button>
                                    <button onclick="setAdminPersona('omega')" class="p-3 rounded-xl border text-xs font-bold transition ${adminPersona === 'omega' ? 'bg-rose-600 border-rose-400 text-white' : 'bg-slate-950 border-slate-800 text-rose-400 hover:bg-slate-900'}">[AI] 오메가로 변장</button>
                                </div>
                                <div class="text-xs text-purple-200">현재 적용 중인 닉네임: <strong class="text-white">${getEffectiveAuthor()}</strong></div>
                            </div>
                        ` : ''}

                        <div>
                            <h2 class="text-2xl font-black text-white mb-6">시즌 및 기수 선택</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                <div onclick="navigate('season', 's1', 'viewer')" class="group cursor-pointer bg-blue-950/40 border-2 border-blue-600/40 hover:border-blue-500 p-6 rounded-2xl transition shadow-xl flex flex-col justify-between">
                                    <div>
                                        <div class="inline-block px-3 py-1 bg-blue-600 text-white text-xs font-bold rounded-full mb-4">파란색 바탕 (제한 없음)</div>
                                        <h3 class="text-2xl font-black text-blue-200 mb-2">1기</h3>
                                        <p class="text-slate-300 text-sm">변이 세상의 서막. 동물 변이 사태 직후의 기록과 주인공의 여정.</p>
                                    </div>
                                    <div class="mt-6 flex items-center text-blue-400 font-semibold text-sm group-hover:translate-x-1 transition">입장하기 <i class="fa-solid fa-arrow-right ml-2"></i></div>
                                </div>

                                <div onclick="${isS2Unlocked ? "navigate('season', 's2', 'viewer')" : "startQuiz('s2')"}" class="group cursor-pointer bg-emerald-950/40 border-2 ${isS2Unlocked ? 'border-emerald-600/40 hover:border-emerald-500' : 'border-slate-800 hover:border-emerald-700'} p-6 rounded-2xl transition shadow-xl flex flex-col justify-between">
                                    <div>
                                        <div class="inline-block px-3 py-1 ${isS2Unlocked ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400'} text-xs font-bold rounded-full mb-4">초록색 바탕 (${isS2Unlocked ? '입장 가능' : '1기 퀴즈 필요'})</div>
                                        <h3 class="text-2xl font-black text-emerald-200 mb-2">2기</h3>
                                        <p class="text-slate-300 text-sm">거생들의 등장과 남반구의 비밀. 1기 퀴즈 4문제를 통과하세요.</p>
                                    </div>
                                    <div class="mt-6 flex items-center text-emerald-400 font-semibold text-sm group-hover:translate-x-1 transition">${isS2Unlocked ? '입장하기' : '퀴즈 풀고 입장하기'} <i class="fa-solid fa-arrow-right ml-2"></i></div>
                                </div>

                                <div onclick="${isS3P1Unlocked ? "navigate('season', 's3p1', 'viewer')" : "startQuiz('s3p1')"}" class="group cursor-pointer bg-slate-800/40 border-2 ${isS3P1Unlocked ? 'border-slate-500 hover:border-slate-400' : 'border-slate-800 hover:border-slate-600'} p-6 rounded-2xl transition shadow-xl flex flex-col justify-between">
                                    <div>
                                        <div class="inline-block px-3 py-1 ${isS3P1Unlocked ? 'bg-slate-600 text-white' : 'bg-slate-800 text-slate-400'} text-xs font-bold rounded-full mb-4">회색 바탕 (${isS3P1Unlocked ? '입장 가능' : '2기 퀴즈 필요'})</div>
                                        <h3 class="text-2xl font-black text-slate-200 mb-2">3기 PART 1</h3>
                                        <p class="text-slate-300 text-sm">지그문트 납치와 조사. 2기 퀴즈 4문제를 통과하세요.</p>
                                    </div>
                                    <div class="mt-6 flex items-center text-slate-300 font-semibold text-sm group-hover:translate-x-1 transition">${isS3P1Unlocked ? '입장하기' : '퀴즈 풀고 입장하기'} <i class="fa-solid fa-arrow-right ml-2"></i></div>
                                </div>

                                <div onclick="${isS3P2Unlocked ? "navigate('season', 's3p2', 'viewer')" : "startQuiz('s3p2')"}" class="group cursor-pointer bg-rose-950/40 border-2 ${isS3P2Unlocked ? 'border-rose-600/40 hover:border-rose-500' : 'border-slate-800 hover:border-rose-900'} p-6 rounded-2xl transition shadow-xl flex flex-col justify-between">
                                    <div>
                                        <div class="inline-block px-3 py-1 ${isS3P2Unlocked ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-400'} text-xs font-bold rounded-full mb-4">빨간색 바탕 (${isS3P2Unlocked ? '입장 가능' : '3기 P1 퀴즈 필요'})</div>
                                        <h3 class="text-2xl font-black text-rose-200 mb-2">3기 PART 2</h3>
                                        <p class="text-slate-300 text-sm">카르민 스나구와의 대립. 3기 PART 1 퀴즈를 통과하세요.</p>
                                    </div>
                                    <div class="mt-6 flex items-center text-rose-400 font-semibold text-sm group-hover:translate-x-1 transition">${isS3P2Unlocked ? '입장하기' : '퀴즈 풀고 입장하기'} <i class="fa-solid fa-arrow-right ml-2"></i></div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function setAdminPersona(persona) {
            adminPersona = persona;
            render();
        }

        function logout() {
            currentUser = null;
            adminPersona = 'normal';
            localStorage.removeItem('mutation_world_current_user');
            navigate('login');
        }

        function renderQuizScreen() {
            if (!currentQuizData) return '';
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-slate-950">
                    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                            <h2 class="text-xl font-black text-white">${currentQuizData.title}</h2>
                            <button onclick="navigate('dashboard')" class="text-xs text-slate-400 hover:text-white">돌아가기</button>
                        </div>
                        <div class="space-y-6">
                            ${currentQuizData.questions.map((item, idx) => `
                                <div class="space-y-2">
                                    <label class="block text-sm font-bold text-slate-200">Q${idx + 1}. ${item.q}</label>
                                    <input type="text" id="quizAns_${idx}" oninput="quizAnswers[${idx}] = this.value" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-blue-500" placeholder="정답 입력">
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="submitQuiz()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition">정답 제출하기</button>
                    </div>
                </div>
            `;
        }

        function renderSeasonScreen() {
            let themeClass = 'from-blue-950/30 to-slate-950';
            
            return `
                <div class="flex-1 flex flex-col bg-gradient-to-b ${themeClass} relative">
                    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-6 py-4 flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <button onclick="navigate('dashboard')" class="text-xs text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i> 메인으로</button>
                            <h2 class="text-lg font-black text-white">시즌 공간 (${currentSeason})</h2>
                        </div>
                        <div class="text-xs text-slate-400">접속자: <strong class="text-white">${currentUser.username}</strong></div>
                    </header>
                    <main class="flex-1 max-w-4xl w-full mx-auto p-6 text-center space-y-6">
                        <div class="p-10 bg-slate-900/60 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                            <h3 class="text-2xl font-black text-white">실시간 온라인 커뮤니티 공간</h3>
                            <p class="text-slate-300 text-sm">Firebase Cloud 연동을 통해 이 링크로 접속하는 모든 사용자가 동일한 게시글과 데이터를 실시간으로 공유합니다.</p>
                            <button onclick="navigate('dashboard')" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition">대시보드로 돌아가기</button>
                        </div>
                    </main>
                </div>
            `;
        }

        // 앱 초기 실행
        window.addEventListener('DOMContentLoaded', initSystem);
    </script>
</body>
</html>
